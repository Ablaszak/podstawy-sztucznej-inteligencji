[project]
name = "basics-of-ai-agh-lab2"
version = "1.0.0"
description = "Basics of Artificial Intelligence course at AGH - lab 2: classification, decision trees, ensembles"
authors = []
requires-python = "==3.12.*"

dependencies = [
    # general
    "matplotlib",
    "numpy",
    "pandas>=3.0",
    "scipy",
    # lab 2 - classification, decision trees, ensembles
    "feature-engine>=1.9",
    "lightgbm==4.*",
    "scikit-learn>=1.8",
]

[dependency-groups]
dev = [
    # not exported to requirements.txt, it breaks Google Colab
    "jupyter",
]
